name: Generate Bible Video

on:
  workflow_dispatch: # Executar manualmente pelo botão "Run workflow"
  schedule: # Executar automaticamente todo dia às 10:00 UTC (07:00 Brasília)
    - cron: '00 13,23 * * *'  # 10h BRT (13h UTC)

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 480  # 8 horas
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick espeak-ng
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install wheel setuptools
          pip install --no-cache-dir -r requirements.txt
          echo "Validating moviepy installation..."
          python -c "import moviepy; print(f'moviepy version: {moviepy.__version__}')"
          python -c "from moviepy.editor import VideoFileClip; print('moviepy.editor import successful')"
      
      - name: Create directories
        run: |
          mkdir -p output/videos output/audio output/temp output/pexels_videos output/subtitles
      
      - name: Setup YouTube credentials
        env:
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          if [ ! -z "$YOUTUBE_CLIENT_SECRET" ]; then
            echo "$YOUTUBE_CLIENT_SECRET" > config/client_secret.json
          fi
          
          if [ ! -z "$YOUTUBE_TOKEN" ]; then
            echo "$YOUTUBE_TOKEN" > config/token.json
          fi
      
      - name: Generate video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          AUTO_PUBLISH: 'true'
          PYTHONWARNINGS: 'ignore'
        run: |
          export PYTHONPATH="${PYTHONPATH}:$(pwd)"
          echo "Starting video generation..."
          python -u run_automated.py
      
      - name: Upload generated video
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: generated-video-${{ github.run_number }}
          path: output/videos/*.mp4
          retention-days: 7
          if-no-files-found: ignore
      
      - name: Upload logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: error-logs-${{ github.run_number }}
          path: |
            output/temp/*.log
            *.log
          retention-days: 7
      
      - name: Cleanup
        if: always()
        run: |
          rm -rf output/temp/* output/pexels_videos/* output/audio/*

