name: Automated YouTube Video Generation

on:
  schedule:
    # Executa às 10h BRT (13h UTC)
    - cron: '0 13 * * *'
    # Executa às 20h BRT (23h UTC)
    - cron: '0 23 * * *'
  workflow_dispatch: # Permite execução manual também

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick
        
    - name: Configure application
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
      run: |
        echo "$YOUTUBE_CLIENT_SECRET" > config/client_secret.json
        echo "$YOUTUBE_TOKEN" > config/token.json
        
    - name: Generate and upload video
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      run: python run_automated.py
      
    - name: Upload artifacts (if needed)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: debug-logs
        path: |
          output/
          *.log
        retention-days: 7

